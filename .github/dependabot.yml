version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait 5 days before updating to help circumvent supply chain attacks
    cooldown:
      default-days: 5
      # Exclude plugin-e2e to prevent false positives with canary e2e tests
      exclude:
        - "@grafana/plugin-e2e"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Upgrade compiler/linter majors together with their peer dependencies.
    # Keep the SDK on the 13.0 line until a coordinated React migration is tested.
    # These proposal limits do not constrain the installed Grafana server version.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@grafana/data"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@grafana/i18n"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@grafana/runtime"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@grafana/schema"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@grafana/ui"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      unit-test:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "@types/jest"
      eslint:
        patterns:
          - "@grafana/eslint-config"
          - "eslint*"
          - "@typescript-eslint/*"
          - "@stylistic/*"
      grafana:
        patterns:
          - "@grafana/*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5

